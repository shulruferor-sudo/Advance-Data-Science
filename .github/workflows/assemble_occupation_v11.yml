name: Assemble verified occupation classification version 11 notebook
on:
  push:
    branches: [main]
    paths:
      - 'project_notebooks/.v11_transfer/**'
      - '.github/workflows/assemble_occupation_v11.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and assemble original notebook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          pieces = sorted(Path('project_notebooks/.v11_transfer').glob('part_*.txt'))
          assert len(pieces) == 28, f'Expected 28 pieces, found {len(pieces)}'
          raw = b''.join(p.read_bytes() for p in pieces)
          expected = '620de9a2cd6efc19c1a7da7de8addfe80a048e781e68c898ada969d080cba5b4'
          actual = sha256(raw).hexdigest()
          assert actual == expected, f'Checksum mismatch: {actual}'
          assert len(raw) == 9502167, f'Unexpected file length: {len(raw)}'
          notebook = json.loads(raw.decode('utf-8'))
          assert len(notebook['cells']) == 87, 'Unexpected notebook cell count'
          target = Path('project_notebooks/occupation_classification_full_comparison_final_v11.ipynb')
          assert not target.exists(), 'Refusing to overwrite a notebook'
          target.write_bytes(raw)
          print(f'Verified {target} with SHA256 {actual}')
          PY
      - name: Commit the verified notebook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project_notebooks/occupation_classification_full_comparison_final_v11.ipynb
          git commit -m 'Publish checksum-verified occupation classification V11 notebook'
          git push origin HEAD:main
