name: Run research notebook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - From_Linguistic_Context_to_Semantic_Structure.ipynb
      - From_Linguistic_Context_to_Semantic_Structure_Tests.ipynb
      - requirements.txt
      - .github/workflows/research-notebook.yml

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install notebook libraries
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run the test notebook against the actual computational notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("From_Linguistic_Context_to_Semantic_Structure_Tests.ipynb")
          notebook = nbformat.read(path, as_version=4)
          try:
              NotebookClient(notebook, timeout=1200, kernel_name="python3", allow_errors=False).execute()
          finally:
              nbformat.write(notebook, path)
              for cell in notebook.cells:
                  for output in cell.get("outputs", []):
                      if output.output_type == "stream":
                          print(output.text)
          PY
      - name: Preserve the executed test notebook
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-tests-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: From_Linguistic_Context_to_Semantic_Structure_Tests.ipynb
  notebook:
    # Manual execution remains available while the earlier corpus run completes.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: research-notebook
      cancel-in-progress: false
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: code/from-linguistic-context-to-semantic-structure
    steps:
      - name: Check out the committed notebook
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned notebook libraries
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Restore verified corpus files and checkpoints
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: experiment/research_corpus
          key: arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-
      - name: Execute the notebook and save each completed cell
        timeout-minutes: 300
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import nbformat
          from nbclient import NotebookClient

          path = Path("From_Linguistic_Context_to_Semantic_Structure.ipynb")
          notebook = nbformat.read(path, as_version=4)
          for cell in notebook.cells:
              if cell.cell_type == "code":
                  cell.outputs = []
                  cell.execution_count = None
          client = NotebookClient(notebook, timeout=17400, kernel_name="python3", allow_errors=False)
          status = {"stage": notebook.metadata["execution_stage"], "completed_cells": [], "complete": False}

          def save():
              temporary = path.with_suffix(".tmp.ipynb")
              nbformat.write(notebook, temporary)
              temporary.replace(path)
              Path("execution_status.json").write_text(json.dumps(status, indent=2))

          try:
              with client.setup_kernel():
                  for index, cell in enumerate(notebook.cells):
                      if cell.cell_type != "code":
                          continue
                      print(f"Executing cell {index + 1}", flush=True)
                      client.execute_cell(cell, index)
                      status["completed_cells"].append(cell.id)
                      save()
                      for output in cell.get("outputs", []):
                          if output.output_type == "stream":
                              print(output.text, flush=True)
              status["complete"] = True
          except BaseException as error:
              status["error"] = f"{type(error).__name__}: {error}"
              raise
          finally:
              status["saved_utc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              save()
          PY
      - name: Preserve the complete corpus in repository history
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          corpus = Path("experiment/research_corpus")
          manifest = json.loads((corpus / "source_manifest.json").read_text())
          register = json.loads((corpus / "source_text_register.json").read_text())
          assert manifest["revision"] == "a68009864dbc3b1decb1a37a6c4f769887169a44"
          assert not register["errors"]
          assert len(register["documents"]) == len(manifest["documents"]) == 8836
          for record in register["documents"]:
              raw = (corpus / "original_text" / (record["document_id"] + ".md")).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == record["sha256"]
          for path in corpus.rglob("*"):
              if path.is_file():
                  assert path.stat().st_size < 100 * 1024 ** 2, path
          print("Verified all 8,836 source files before saving the corpus to repository history.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force experiment/research_corpus
          if ! git diff --cached --quiet; then
            git commit -m "Preserve complete pinned arXiv text corpus and normalization records"
            cp From_Linguistic_Context_to_Semantic_Structure.ipynb "$RUNNER_TEMP/executed-research-notebook.ipynb"
            trap 'cp "$RUNNER_TEMP/executed-research-notebook.ipynb" From_Linguistic_Context_to_Semantic_Structure.ipynb' EXIT
            git restore -- From_Linguistic_Context_to_Semantic_Structure.ipynb
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save resumable corpus checkpoint
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: experiment/research_corpus
          key: arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve executed notebook and inspection results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-notebook-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 9
          path: |
            From_Linguistic_Context_to_Semantic_Structure.ipynb
            execution_status.json
            figures/
            experiment/research_corpus/*manifest.json
            experiment/research_corpus/*progress.json
            experiment/research_corpus/*register.json
            experiment/research_corpus/document_metadata.json
