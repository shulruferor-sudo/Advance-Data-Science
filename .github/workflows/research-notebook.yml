name: Run research notebook

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - project_notebooks/**
      - Figures.ipynb
      - PDF_Creation/**
      - Datasets/Datasets.ipynb
      - .github/workflows/research-notebook.yml

permissions:
  contents: write

jobs:
  continuation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.state.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: state
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PYGATE'
          import json, os
          from pathlib import Path
          path=Path("project_notebooks/from_linguistic_context_to_semantic_structure/results/verification.json")
          complete=path.exists() and json.loads(path.read_text()).get("complete") is True
          run=os.environ["EVENT"]!="schedule" or not complete
          with open(os.environ["GITHUB_OUTPUT"],"a") as stream:
              stream.write("run="+str(run).lower()+"\n")
          PYGATE
  validate:
    needs: continuation
    if: needs.continuation.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate notebook documents and code cells
        run: |
          python - <<'PYVALIDATE'
          import ast, json
          from pathlib import Path
          for path in (Path("Datasets/Datasets.ipynb"), Path("Figures.ipynb"), Path("PDF_Creation/PDF_Creator.ipynb"), *Path("project_notebooks").rglob("*.ipynb")):
              notebook=json.loads(path.read_text())
              assert len({c["id"] for c in notebook["cells"]}) == len(notebook["cells"])
              for i, cell in enumerate(notebook["cells"]):
                  if cell["cell_type"]=="code":
                      assert i and notebook["cells"][i-1]["cell_type"]=="markdown"
                      ast.parse("".join(cell["source"]))
          PYVALIDATE
  notebook:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: research-notebook
      cancel-in-progress: false
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      PIPELINE_TIME_BUDGET_SECONDS: "14400"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the committed notebook
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb
      - name: Install the pinned notebook libraries
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          import json
          notebook = json.loads(Path("project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb").read_text())
          reporter = next(cell for cell in notebook["cells"] if cell.get("id") == "failure-reporting")
          exec(compile("".join(reporter["source"]), "failure-reporting", "exec"))
          cells = [cell for cell in notebook["cells"] if cell.get("id") == "dependencies"]
          assert len(cells) == 1
          exec(compile("".join(cells[0]["source"]), "notebook-dependencies", "exec"))
          PYINSTALL
      - name: Restore verified corpus files and checkpoints
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            project_notebooks/from_linguistic_context_to_semantic_structure/results
            project_notebooks/from_linguistic_context_to_semantic_structure/models
            project_notebooks/from_linguistic_context_to_semantic_structure/execution_status.json
          key: project-context-a68009864dbc3b1decb1a37a6c4f769887169a44-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            project-context-a68009864dbc3b1decb1a37a6c4f769887169a44-
      - name: Recover checkpoints from jobs started before the folder move
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: corpus
          key: legacy-read-only-${{ github.run_id }}
          restore-keys: |
            arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-
      - name: Reconcile legacy project outputs without modifying shared datasets
        run: |
          python - <<'PYRECOVER'
          import json, shutil
          from pathlib import Path
          old=Path("corpus")
          new=Path("project_notebooks/from_linguistic_context_to_semantic_structure")
          def saved(folder):
              path=folder/"execution_status.json"
              return json.loads(path.read_text()).get("saved_utc", "") if path.exists() else ""
          newer=saved(old)>saved(new)
          for name in ("models","results"):
              for source in (old/name).rglob("*"):
                  if source.is_file():
                      destination=new/source.relative_to(old)
                      if newer or not destination.exists():
                          destination.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copy2(source,destination)
          if newer and (old/"execution_status.json").exists():
              shutil.copy2(old/"execution_status.json",new/"execution_status.json")
          PYRECOVER
      - name: Reuse pinned pretrained models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: project_notebooks/from_linguistic_context_to_semantic_structure/models
          key: workspace-pretrained-bert-86b5e093-chonky-4a92de55
      - name: Execute the notebook and save each completed cell
        timeout-minutes: 300
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import nbformat
          from nbclient import NotebookClient

          path = Path("project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb")
          notebook = nbformat.read(path, as_version=4)
          for cell in notebook.cells:
              if cell.cell_type == "code":
                  cell.outputs = []
                  cell.execution_count = None
          client = NotebookClient(notebook, timeout=17400, kernel_name="python3", allow_errors=False)
          status = {"stage": notebook.metadata["execution_stage"], "completed_cells": [], "complete": False}

          def save():
              temporary = path.with_suffix(".tmp.ipynb")
              nbformat.write(notebook, temporary)
              temporary.replace(path)
              Path("project_notebooks/from_linguistic_context_to_semantic_structure/execution_status.json").write_text(json.dumps(status, indent=2))

          try:
              with client.setup_kernel():
                  for index, cell in enumerate(notebook.cells):
                      if cell.cell_type != "code":
                          continue
                      print(f"Executing cell {index + 1}", flush=True)
                      client.execute_cell(cell, index)
                      status["completed_cells"].append(cell.id)
                      save()
                      for output in cell.get("outputs", []):
                          if output.output_type == "stream":
                              print(output.text, flush=True)
              status["complete"] = True
          except BaseException as error:
              if getattr(error,"ename",None)=="CheckpointPause":
                  status["paused"]=True
                  status["continuation"]="Resume from saved per-source, per-candidate or training-batch checkpoints."
              else:
                  status["error"] = f"{type(error).__name__}: {error}"
                  raise
          finally:
              status["saved_utc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              save()
          PY
      - name: Preserve verified corpus and computational checkpoints in repository history
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import json
          import subprocess
          corpus = Path("Datasets/arxiv_research_papers_2020")
          project = Path("project_notebooks/from_linguistic_context_to_semantic_structure")
          notebook=json.loads((project/"Proof.ipynb").read_text())
          names={"save_json","file_sha256","pack_large_files"}
          definitions=[]
          for cell in notebook["cells"]:
              if cell["cell_type"]=="code":
                  definitions.extend(node for node in ast.walk(ast.parse("".join(cell["source"])))
                      if isinstance(node,ast.FunctionDef) and node.name in names)
          assert {node.name for node in definitions}==names
          exec(compile(ast.Module(body=definitions,type_ignores=[]),"project-checkpoint-storage","exec"))
          pack_large_files(project)
          files=[]
          for path in project.rglob("*"):
              if path.is_file() and ".cache" not in path.parts and not path.name.endswith((".tmp", ".ipynb")):
                  if path.stat().st_size >= 90 * 1024**2:
                      assert path.with_name(path.name+".parts").joinpath("manifest.json").exists(), path
                  else:
                      files.append(str(path))
          subprocess.run(["git","add","-u","--",str(project)],check=True)
          subprocess.run(["git","reset","--",str(project/"Proof.ipynb")],check=True)
          for start in range(0,len(files),200):
              subprocess.run(["git","add","--force","--",*files[start:start+200]],check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Save verified corpus and resumable computational progress"
            cp project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb "$RUNNER_TEMP/executed-research-notebook.ipynb"
            trap 'cp "$RUNNER_TEMP/executed-research-notebook.ipynb" project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb' EXIT
            git restore -- project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save resumable corpus checkpoint
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            project_notebooks/from_linguistic_context_to_semantic_structure/results
            project_notebooks/from_linguistic_context_to_semantic_structure/models
            project_notebooks/from_linguistic_context_to_semantic_structure/execution_status.json
          key: project-context-a68009864dbc3b1decb1a37a6c4f769887169a44-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve executed notebook and inspection results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-notebook-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 9
          path: |
            project_notebooks/from_linguistic_context_to_semantic_structure/Proof.ipynb
            project_notebooks/from_linguistic_context_to_semantic_structure/execution_status.json
            project_notebooks/from_linguistic_context_to_semantic_structure/results/figures/
            project_notebooks/from_linguistic_context_to_semantic_structure/results/verification.json
            project_notebooks/from_linguistic_context_to_semantic_structure/results/*summary.json
            project_notebooks/from_linguistic_context_to_semantic_structure/results/*self_test.json
            project_notebooks/from_linguistic_context_to_semantic_structure/results/cluster_sweep*.json
            project_notebooks/from_linguistic_context_to_semantic_structure/results/source_partitions.json
            project_notebooks/from_linguistic_context_to_semantic_structure/results/segmentation.json



