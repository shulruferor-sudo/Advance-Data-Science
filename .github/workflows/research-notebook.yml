name: Run research notebook

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - Proof.ipynb
      - Unit_Tests.ipynb
      - Figure_Generator.ipynb
      - .github/workflows/research-notebook.yml

permissions:
  contents: write

jobs:
  continuation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.state.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: state
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PYGATE'
          import json, os
          from pathlib import Path
          path=Path("corpus/results/verification.json")
          complete=path.exists() and json.loads(path.read_text()).get("complete") is True
          run=os.environ["EVENT"]!="schedule" or not complete
          with open(os.environ["GITHUB_OUTPUT"],"a") as stream:
              stream.write("run="+str(run).lower()+"\n")
          PYGATE
  tests:
    needs: continuation
    if: needs.continuation.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proof.ipynb
      - name: Install notebook libraries
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          import json
          notebook = json.loads(Path("Proof.ipynb").read_text())
          cells = [cell for cell in notebook["cells"] if cell.get("id") == "dependencies"]
          assert len(cells) == 1
          exec(compile("".join(cells[0]["source"]), "notebook-dependencies", "exec"))
          PYINSTALL
      - name: Reuse pinned pretrained models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: corpus/models
          key: pretrained-bert-86b5e093-chonky-4a92de55
      - name: Run the test notebook against the actual computational notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("Unit_Tests.ipynb")
          notebook = nbformat.read(path, as_version=4)
          try:
              NotebookClient(notebook, timeout=1200, kernel_name="python3", allow_errors=False).execute()
          finally:
              nbformat.write(notebook, path)
              for cell in notebook.cells:
                  for output in cell.get("outputs", []):
                      if output.output_type == "stream":
                          print(output.text)
          PY
      - name: Preserve the executed test notebook
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-tests-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: Unit_Tests.ipynb
  notebook:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: research-notebook
      cancel-in-progress: false
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      PIPELINE_TIME_BUDGET_SECONDS: "14400"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the committed notebook
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proof.ipynb
      - name: Install the pinned notebook libraries
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          import json
          notebook = json.loads(Path("Proof.ipynb").read_text())
          cells = [cell for cell in notebook["cells"] if cell.get("id") == "dependencies"]
          assert len(cells) == 1
          exec(compile("".join(cells[0]["source"]), "notebook-dependencies", "exec"))
          PYINSTALL
      - name: Restore verified corpus files and checkpoints
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: corpus
          key: arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-
      - name: Reuse pinned pretrained models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: corpus/models
          key: pretrained-bert-86b5e093-chonky-4a92de55
      - name: Execute the notebook and save each completed cell
        timeout-minutes: 300
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import nbformat
          from nbclient import NotebookClient

          path = Path("Proof.ipynb")
          notebook = nbformat.read(path, as_version=4)
          for cell in notebook.cells:
              if cell.cell_type == "code":
                  cell.outputs = []
                  cell.execution_count = None
          client = NotebookClient(notebook, timeout=17400, kernel_name="python3", allow_errors=False)
          status = {"stage": notebook.metadata["execution_stage"], "completed_cells": [], "complete": False}

          def save():
              temporary = path.with_suffix(".tmp.ipynb")
              nbformat.write(notebook, temporary)
              temporary.replace(path)
              Path("corpus/execution_status.json").write_text(json.dumps(status, indent=2))

          try:
              with client.setup_kernel():
                  for index, cell in enumerate(notebook.cells):
                      if cell.cell_type != "code":
                          continue
                      print(f"Executing cell {index + 1}", flush=True)
                      client.execute_cell(cell, index)
                      status["completed_cells"].append(cell.id)
                      save()
                      for output in cell.get("outputs", []):
                          if output.output_type == "stream":
                              print(output.text, flush=True)
              status["complete"] = True
          except BaseException as error:
              if getattr(error,"ename",None)=="CheckpointPause":
                  status["paused"]=True
                  status["continuation"]="Resume from saved per-source, per-candidate or training-batch checkpoints."
              else:
                  status["error"] = f"{type(error).__name__}: {error}"
                  raise
          finally:
              status["saved_utc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              save()
          PY
      - name: Preserve verified corpus and computational checkpoints in repository history
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import json
          import subprocess
          corpus = Path("corpus")
          if not (corpus/"source_text_register.json").exists():
              raise SystemExit("No verified source register to publish yet.")
          notebook=json.loads(Path("Proof.ipynb").read_text())
          names={"save_json","file_sha256","pack_large_files"}
          definitions=[]
          for cell in notebook["cells"]:
              if cell["cell_type"]=="code":
                  definitions.extend(node for node in ast.parse("".join(cell["source"])).body
                      if isinstance(node,ast.FunctionDef) and node.name in names)
          assert {node.name for node in definitions}==names
          exec(compile(ast.Module(body=definitions,type_ignores=[]),"notebook-checkpoint-storage","exec"))
          pack_large_files(corpus)
          manifest = json.loads((corpus / "source_manifest.json").read_text())
          register = json.loads((corpus / "source_text_register.json").read_text())
          assert manifest["revision"] == "a68009864dbc3b1decb1a37a6c4f769887169a44"
          assert not register["errors"]
          assert len(register["documents"]) == len(manifest["documents"]) == 8836
          for record in register["documents"]:
              raw = (corpus / "original_text" / (record["document_id"] + ".md")).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == record["sha256"]
          files=[]
          for path in corpus.rglob("*"):
              if path.is_file() and ".cache" not in path.parts and not path.name.endswith(".tmp"):
                  if path.stat().st_size >= 90 * 1024**2:
                      assert path.with_name(path.name+".parts").joinpath("manifest.json").exists(), path
                  else:
                      files.append(str(path))
          # Stage deletions and only files below GitHub's single-file size limit.
          subprocess.run(["git","add","-u","--","corpus"],check=True)
          for start in range(0,len(files),200):
              subprocess.run(["git","add","--force","--",*files[start:start+200]],check=True)
          print("Verified all 8,836 sources and packed large model/result artifacts before saving history.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Save verified corpus and resumable computational progress"
            cp Proof.ipynb "$RUNNER_TEMP/executed-research-notebook.ipynb"
            trap 'cp "$RUNNER_TEMP/executed-research-notebook.ipynb" Proof.ipynb' EXIT
            git restore -- Proof.ipynb
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save resumable corpus checkpoint
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: corpus
          key: arxiv-a68009864dbc3b1decb1a37a6c4f769887169a44-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve executed notebook and inspection results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-notebook-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 9
          path: |
            Proof.ipynb
            corpus/execution_status.json
            corpus/results/figures/
            corpus/results/verification.json
            corpus/results/*summary.json
            corpus/results/*self_test.json
            corpus/results/cluster_sweep*.json
            corpus/results/source_partitions.json
            corpus/results/segmentation.json
            corpus/*manifest.json
            corpus/*progress.json
            corpus/*register.json
            corpus/document_metadata.json
