name: Verify Codespaces environment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespaces.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespaces.yml'
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and exercise the actual development container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          runCmd: python .devcontainer/verify.py
