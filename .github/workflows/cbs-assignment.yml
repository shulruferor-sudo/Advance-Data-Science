name: Verify CBS assignment notebook

on:
  push:
    paths:
      - 'project_notebooks/cbs_occupation_classification/**'
      - 'Datasets/cbs_occupation_survey_sample/**'
      - '.github/workflows/cbs-assignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            project_notebooks/cbs_occupation_classification
            Datasets/cbs_occupation_survey_sample
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scikit-learn==1.8.0 openpyxl==3.1.5 nbformat==5.10.4 nbclient==0.10.2 ipykernel==6.30.1
      - name: Execute in a fresh Jupyter kernel and verify results
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, nbformat
          from nbclient import NotebookClient
          project=Path('project_notebooks/cbs_occupation_classification')
          data=Path('Datasets/cbs_occupation_survey_sample/DUMMY_DATASET.xlsx')
          expected='e1e7f391c0675dd14830eaae6b5cd114edc256f18b956bb48a454b0b1209e1ac'
          assert hashlib.sha256(data.read_bytes()).hexdigest()==expected
          notebook=nbformat.read(project/'Assignment.ipynb', as_version=4)
          for cell in notebook.cells:
              if cell.cell_type=='code':
                  cell.outputs=[]
                  cell.execution_count=None
          NotebookClient(notebook, timeout=300, kernel_name='python3', allow_errors=False, resources={'metadata':{'path':str(project.resolve())}}).execute()
          nbformat.write(notebook, project/'Executed_Assignment.ipynb')
          result=json.loads((project/'results/run_results.json').read_text())
          assert result['dataset_sha256']==expected
          assert len(result['checks'])==14 and all(result['checks'].values())
          assert result['quality']['records']==200
          assert abs(result['primary_metrics']['accuracy']-76/191)<1e-12
          assert hashlib.sha256(data.read_bytes()).hexdigest()==expected
          print('Fresh-kernel execution passed. 14 checks passed. Primary accuracy 76/191.')
          PY
      - name: Save executed notebook and results
        uses: actions/upload-artifact@v4
        with:
          name: cbs-assignment-verified
          path: |
            project_notebooks/cbs_occupation_classification/Executed_Assignment.ipynb
            project_notebooks/cbs_occupation_classification/results/
          retention-days: 30
