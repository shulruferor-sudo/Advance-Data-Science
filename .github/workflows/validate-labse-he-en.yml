name: Free LaBSE Hebrew-English Colab notebook check
on:
  push:
    branches: [validation/labse-multilingual-smoketest]
    paths:
      - 'experiments/labse_he_en_colab_validation.ipynb'
      - '.github/workflows/validate-labse-he-en.yml'
permissions:
  contents: write
jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/labse_he_en_colab_validation.ipynb
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: python -m pip install --quiet 'sentence-transformers==5.1.2' nbclient nbformat ipykernel
      - name: Execute notebook and record measured similarity scores
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          p = "experiments/labse_he_en_colab_validation.ipynb"
          nb = nbformat.read(p, as_version=4)
          nbformat.validate(nb)
          executed = NotebookClient(nb, timeout=1800, kernel_name="python3", allow_errors=False).execute()
          lines = []
          for cell in executed.cells:
              if cell.cell_type == "code":
                  for output in cell.get("outputs", []):
                      if output.output_type == "stream":
                          lines.append(output.get("text", ""))
                      elif output.output_type == "execute_result":
                          lines.append(str(output.get("data", {}).get("text/plain", "")))
          lines.append("\nNOTEBOOK_EXECUTION_SUCCESS\n")
          text = "".join(lines)
          print(text)
          Path("experiments/labse_validation_results.txt").write_text(text, encoding="utf-8")
          PY
      - name: Preserve actual result on isolated validation branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add experiments/labse_validation_results.txt
          git commit -m "Record actual LaBSE model inference results [skip ci]"
          git push origin HEAD:validation/labse-multilingual-smoketest
