<title>Adversarial networks and gradient paths</title>
<desc>A schematic generator transforms latent inputs into synthetic samples. Real and generated samples enter a discriminator. A dashed curve indicates the gradient path from the generator objective through the discriminator and back to the generator. A small illustrative similarity matrix represents batch relationships. Network sizes and matrix values are schematic.</desc>
