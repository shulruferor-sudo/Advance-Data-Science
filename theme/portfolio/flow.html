<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio flow diagram</title>
<link rel="stylesheet" href="./portfolio.css">
<style>
.flow-example {
  max-inline-size: 62rem;
  margin-inline: auto;
  padding: clamp(1.25rem, 5vw, 4rem);
  background: #f8f7f1;
  color: #253d31;
}
.flow-example h1 {
  color: #234737;
}
.flow-example p {
  color: #59695f;
}
.flow-track {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(1rem, .16fr) minmax(0, 1fr) minmax(1rem, .16fr) minmax(0, 1fr);
  align-items: center;
  margin-block: 3rem;
}
.flow-stage {
  position: relative;
  z-index: 1;
  overflow: hidden;
  isolation: isolate;
  display: grid;
  min-block-size: 6rem;
  place-items: center;
  padding: .5rem 1rem;
  border-radius: 5rem;
  background: linear-gradient(110deg, var(--from), var(--to));
  box-shadow: inset 0 1px 2px #ffffff9c;
  text-align: center;
  font-weight: 600;
}
.flow-stage:nth-of-type(1) { --from: #83bcb5; --to: #d6efe4; }
.flow-stage:nth-of-type(2) { --from: #b6ddd4; --to: #e2f3eb; }
.flow-stage:nth-of-type(3) { --from: #9ebdc8; --to: #dde6ef; }
.flow-joint {
  block-size: .9rem;
  margin-inline: -.35rem;
  background: linear-gradient(90deg, #d6efe4, #9ebdc8);
}
.flow-stage::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(110deg, transparent 25%, #ffffff68 50%, transparent 75%);
  transform: translateX(-105%);
  animation: flow-light 6s ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
.flow-stage:nth-of-type(2) { --delay: .45s; }
.flow-stage:nth-of-type(3) { --delay: .9s; }
@keyframes flow-light {
  0%, 16% { transform: translateX(-105%); }
  58%, 100% { transform: translateX(105%); }
}
@media (max-width: 35rem) {
  .flow-track { grid-template-columns: 1fr; justify-items: center; }
  .flow-stage { inline-size: 85%; min-block-size: 4.5rem; box-sizing: border-box; }
  .flow-joint { inline-size: .85rem; block-size: 1.25rem; margin: -.2rem 0; }
}
@media (prefers-reduced-motion: reduce) {
  .flow-stage::after { animation: none; }
}
</style>
</head>
<body class="portfolio">
<main class="flow-example">
  <h1>Classification flow</h1>
  <p>Complement Naive Bayes scoring</p>
  <div class="flow-track" aria-label="Record features are combined with weights learned from other occupations to produce class scores.">
    <div class="flow-stage">Record features</div>
    <span class="flow-joint" aria-hidden="true"></span>
    <div class="flow-stage">Other-occupation weights</div>
    <span class="flow-joint" aria-hidden="true"></span>
    <div class="flow-stage">Class scores</div>
  </div>
</main>
</body>
</html>
